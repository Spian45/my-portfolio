<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammad Ibnu - Links</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            text-align: center;
            box-sizing: border-box;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #38bdf8;
            margin-bottom: 1rem;
            object-fit: cover;
        }
        h1 {
            margin: 0;
            font-size: 1.75rem;
            color: #f8fafc;
        }
        p.bio {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }
        .link-btn {
            display: block;
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            background-color: #1e293b;
            color: #f8fafc;
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid #334155;
            transition: all 0.2s ease;
            font-weight: 500;
            box-sizing: border-box;
        }
        .link-btn:hover {
            background-color: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
            transform: translateY(-3px);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- You can replace the src URL with a direct link to your own photo -->
        <img src="https://ui-avatars.com/api/?name=Muhammad+Ibnu&background=38bdf8&color=fff&size=120" alt="Muhammad Ibnu" class="profile-img">

        <h1>Muhammad Ibnu</h1>
        <p class="bio">Informatics Engineering Student in Makassar 💻<br>I Like Games</p>

        <!-- Replace the href links with your actual profile URLs -->
        <a href="https://github.com/YOUR_GITHUB" class="link-btn" target="_blank">GitHub</a>
        <a href="https://steamcommunity.com/id/YOUR_STEAM" class="link-btn" target="_blank">Steam</a>
        <a href="https://discord.com/users/YOUR_DISCORD_ID" class="link-btn" target="_blank">Discord</a>
        <a href="https://instagram.com/YOUR_IG" class="link-btn" target="_blank">Instagram</a>
    </div>
</body>
</html>
